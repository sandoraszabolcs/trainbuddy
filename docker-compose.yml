services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: trainbuddy
      POSTGRES_PASSWORD: trainbuddy
      POSTGRES_DB: trainbuddy
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainbuddy -d trainbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://trainbuddy:trainbuddy@db:5432/trainbuddy
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:8000/auth/strava/callback}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret}
      ENABLE_DEV_LOGIN: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
