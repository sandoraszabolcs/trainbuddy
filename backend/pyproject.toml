[project]
name = "trainbuddy-backend"
version = "0.1.0"
description = "Training-partner matcher: Strava sync, geo matching, LangGraph agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "polyline>=2.0",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "itsdangerous>=2.2",
    "sse-starlette>=2.1",
    "fastembed>=0.4",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
    # `uv venv` ships no pip, and PyCharm's package manager and bundled pytest
    # runner both need it. The runner also imports pkg_resources, which
    # setuptools dropped in 81 - hence the ceiling. Neither is used at runtime.
    "pip",
    "setuptools<81",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "eval: LLM eval cases (costs money, run explicitly with -m eval)",
    "integration: needs a live Postgres via testcontainers",
]
addopts = "-m 'not eval'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
